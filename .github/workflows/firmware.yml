# Püsivara ehitus ja release
#   * iga push main-i / pull request → kompileerimise kontroll
#   * silt v* (nt v1.2.0) → GitHub release koos püsivarafailidega
#     Seade leiab selle FOTA kaudu (⚙ → Püsivara → Kontrolli uuendusi).
#   * käsitsi käivitus (Actions → Firmware → Run workflow, sisend "tag",
#     nt v1.4.0) → sama release; silt luuakse valitud haru viimasele commitile.
name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release'i silt (nt v1.4.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # silt (push) või käsitsi käivituse sisend; tühi = ainult kompileerimise kontroll
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build
        env:
          SIMCAM_VERSION: ${{ env.RELEASE_TAG }}
        run: pio run -e t-simcam

      - name: Prepare release files
        if: startsWith(env.RELEASE_TAG, 'v')
        run: |
          cp .pio/build/t-simcam/firmware.bin simcam-firmware.bin
          cp .pio/build/t-simcam/firmware.factory.bin simcam-factory.bin
          sha256sum simcam-*.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        if: startsWith(env.RELEASE_TAG, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            simcam-firmware.bin
            simcam-factory.bin
            SHA256SUMS.txt
          generate_release_notes: true
