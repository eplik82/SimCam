; =============================================================================
;  SimCam – LilyGO T-SIMCAM (ESP32-S3) LTE kaamera
;  PlatformIO projektifail
; =============================================================================
;
;  Raamistik: Arduino-ESP32 3.x (ESP-IDF 5.x peal) läbi pioarduino platvormi.
;  3.x on vajalik, sest ainult selles on sisseehitatud PPP teek (PPP.h,
;  esp_modem + CMUX), mida kasutame LTE modemiga PPPoS ühenduse loomiseks.
;  Ametlik "platform = espressif32" pakub endiselt vaid Arduino 2.x-i.
;
;  T-SIMCAM: ESP32-S3R8 (8 MB OPI PSRAM) + 16 MB flash (W25Q128, kontrollitud).
;  Partitsioonid: default_16MB.csv (2 × 6,25 MB rakendus + 3,4 MB SPIFFS).
; =============================================================================

[platformio]
default_envs = t-simcam

[env:t-simcam]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board     = esp32-s3-devkitc-1

; --- Mälu ja flash ---------------------------------------------------------
board_build.arduino.memory_type = qio_opi      ; QIO flash + Octal PSRAM (8 MB)
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.partitions          = default_16MB.csv
board_build.f_cpu               = 240000000L

; --- Serial / USB ----------------------------------------------------------
; T-SIMCAM USB-C on ühendatud otse ESP32-S3 native USB-ga (USB-Serial-JTAG).
; ARDUINO_USB_CDC_ON_BOOT=1 → Serial = USB CDC, logid tulevad USB kaudu.
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3              ; 0=none … 3=info … 5=verbose
    -DCONFIG_ARDUHAL_LOG_COLORS=0

; Püsivara versioon (git silt / GitHub Actions) → SIMCAM_VERSION, vt tools/version.py
extra_scripts = pre:tools/version.py

; --- Teegid ----------------------------------------------------------------
; esp32-camera ja PPP (esp_modem) tulevad Arduino-ESP32 3.x-ga kaasa.
; OV5640 autofookuse püsivara (VCM mootori mikrokood) laeb see teek sensorisse.
lib_deps =
    https://github.com/0015/ESP32-OV5640-AF.git
